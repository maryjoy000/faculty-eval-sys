<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <style>
    @media print {
      @page {
        size: 21.59cm 33.02cm;
        margin: 1cm;
      }
      #report-tab-content table td,
      #report-tab-content table th {
        padding-top: 1px !important;
        padding-bottom: 1px !important;
        padding-left: 2px !important;
        padding-right: 2px !important;
        line-height: 1.1 !important;
      }
      #report-tab-content table {
        margin-bottom: 3px !important;
        border-spacing: 0 !important;
      }
    }
  </style>
</head>
<body>

  <div id="app-hr-shell" data-active-page="reports"></div>

  <template id="page-content-template">

    <!-- ============================================
         LIST VIEW
    ============================================ -->
    <div id="reports-list-view">

      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Reports</h1>
        <p class="text-sm text-gray-500 mt-1">View and print evaluation reports for each faculty member.</p>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
        <!-- Search and status filters -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4">
          <input
            type="text"
            id="hr-reports-search-input"
            placeholder="Search faculty name..."
            class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
          >

          <select
            id="hr-reports-status-filter"
            class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
          >
            <option value="all">All Statuses</option>
            <option value="with-results">With Results Only</option>
            <option value="without-results">Without Results</option>
          </select>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
