<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Management | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
</head>

<body>

  <div id="app-hr-shell" data-active-page="faculty"></div>

  <template id="page-content-template">

    <!-- Page header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Faculty Management</h1>
        <p class="text-sm text-gray-500 mt-1">
          Manage and monitor faculty evaluation statuses.
        </p>
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          id="export-btn"
          class="btn-secondary flex items-center gap-2 text-sm">
          Export
        </button>
      </div>
    </div>

    <!-- Main card -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">

      <!-- Search + status filter -->
      <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <input
          type="text"
          id="search-input"
          placeholder="Search name or section..."
          class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">

        <select
          id="status-filter"
          class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
          <option value="active">Active Only</option>
          <option value="all">All (Including Archived)</option>
          <option value="archived">Archived Only</option>
        </select>
      </div>

      <!-- Faculty table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b border-gray-300 text-gray-700">
              <th class="py-2 pr-4 font-semibold">Faculty Name</th>
              <th class="py-2 pr-4 font-semibold">Section</th>
              <th class="py-2 pr-4 font-semibold">Advisory</th>
              <th class="py-2 pr-4 font-semibold">Status</th>
              <th class="py-2 font-semibold">Actions</th>
            </tr>
          </thead>

          <tbody id="faculty-management-table-body">
          </tbody>
        </table>
      </div>

      <div id="faculty-management-pagination" class="no-print"></div>

    </div>

    <!-- Shared actions dropdown -->
    <div
      id="shared-actions-dropdown"
      class="hidden fixed w-44 bg-white border border-gray-200 rounded-lg shadow-lg z-50 py-1 text-sm">

      <p class="px-4 py-1.5 text-xs font-semibold text-gray-400">
        Actions
      </p>

      <a
        href="#"
        data-action="view-report"
        class="block px-4 py-2 text-gray-700 hover:bg-gray-50">
        View Reports
      </a>

      <a
        href="#"
        data-action="edit-details"
        class="block px-4 py-2 text-gray-700 hover:bg-gray-50">
        Edit Details
      </a>

    </div>

    <!-- Edit Details modal -->
    <div
      id="edit-details-modal"
      class="fixed inset-0 z-50 hidden flex items-center justify-center">

      <!-- Backdrop -->
      <div
        id="edit-details-modal-backdrop"
        class="absolute inset-0 bg-black/40">
      </div>

      <!-- Modal Panel -->
      <div
        class="relative z-10 w-full max-w-2xl mx-4 rounded-xl bg-white shadow-xl">

        <!-- Header -->
        <div class="px-6 pt-6">
          <h2 class="text-lg font-semibold text-gray-800">
            Edit Details
          </h2>

          <p
            id="edit-details-faculty-name"
            class="text-sm text-gray-500 mt-1">
          </p>
        </div>

        <!-- Content -->
        <div class="px-6 pt-5 pb-6">

          <!-- Sections -->
          <div class="mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Sections
            </label>

            <div
              id="section-list"
              class="space-y-2 mb-3">
            </div>

            <div class="flex gap-2 w-full">

              <select
                id="section-master-select"
                class="flex-1 min-w-0 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                <option value="">Select section from master list</option>
              </select>

              <button
                type="button"
                id="add-section-btn"
                class="btn-secondary shrink-0 text-sm px-4">
                Add
              </button>

            </div>

            <p class="text-xs text-gray-400 mt-1.5">
              Sections come from the Enrollment master list.
            </p>
          </div>

          <!-- Advisory Classes -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Advisory Classes
            </label>

            <div
              id="advisory-class-list"
              class="space-y-2 mb-3">
            </div>

            <div class="flex gap-2 w-full">

              <select
                id="advisory-class-select"
                class="flex-1 min-w-0 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                <option value="">Select advisory class</option>
              </select>

              <button
                type="button"
                id="add-advisory-class-btn"
                class="btn-secondary shrink-0 text-sm px-4">
                Add
              </button>

            </div>
          </div>

          <!-- Done -->
          <button
            type="button"
            id="close-edit-details-btn"
            class="btn-primary w-full py-2.5">
            Done
          </button>

        </div>
      </div>
    </div>

  </template>

  <script src="../../js/utils/session.js"></script>
  <script src="../../js/data/profile-data.js"></script>
  <script src="../../js/data/activity-log.js"></script>
  <script src="../../js/data/notifications-data.js"></script>
  <script src="../../js/data/faculty-roster.js"></script>
  <script src="../../js/components/hr-sidebar.js"></script>
  <script src="../../js/components/confirm-modal.js"></script>
  <script src="../../js/utils/api.js"></script>
  <script src="../../js/utils/pagination.js"></script>
  <script src="../../assets/js/xlsx.full.min.js"></script>
  <script src="../../js/pages/hr-faculty-management.js"></script>

</body>

</html>
