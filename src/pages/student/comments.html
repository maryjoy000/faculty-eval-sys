<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments &amp; Suggestions | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Reusable header injects here -->
  <div id="app-header" data-greeting="Student" data-show-logout="true"></div>

  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- Page title + breadcrumb -->
    <section class="mb-6">
      <h1 class="text-2xl font-bold text-brand">Faculty Evaluation Form</h1>
      <p class="text-gray-500 text-sm mt-1" id="academic-year-display"></p>
      <!-- Reusable stepper injects here -->
      <div id="app-stepper" data-active-step="3"></div>
    </section>

    <!-- Main content card -->
    <section class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">

      <h2 class="text-lg font-semibold text-brand mb-1">Qualitative Assessment</h2>
      <p class="text-sm text-gray-600 mb-2">
        Please provide detailed comments. The system uses
        <strong class="text-gray-800">Sentiment Analysis</strong> to categorize your feedback.
      </p>
      <p class="text-sm text-gray-700 mb-6">
        <span class="font-medium text-brand">Evaluating:</span>
        <span id="evaluating-faculty-name">--</span>
      </p>

      <label for="comments-textarea" class="block text-sm font-medium text-gray-800 mb-2">
        Comments and Suggestions:
      </label>
      <textarea
        id="comments-textarea"
        rows="8"
        class="w-full border border-gray-300 rounded-lg p-4 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent resize-none disabled:bg-gray-100 disabled:text-gray-500"
      ></textarea>
      <p class="text-xs text-gray-500 mt-2 mb-6">
        Your comments are anonymous and will help improve teaching standards.
      </p>

      <!-- Navigation / submission area -->
      <div class="flex items-center justify-between pt-4 border-t border-gray-200">
        <button
          type="button" id="back-btn"
          class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Back
        </button>

        <div id="submit-area" class="flex items-center gap-3">
          <button type="button" id="submit-btn" class="btn-primary">
            Submit Evaluation
          </button>
        </div>
      </div>

    </section>
    
    <div id="rating-summary-container" class="hidden"></div>

  </main>

  <script src="../../js/utils/session.js"></script>
  <script src="../../js/data/system-settings.js"></script>
  <script src="../../js/data/profile-data.js"></script>
  <script src="../../js/data/notifications-data.js"></script>
  <script src="../../js/utils/api.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/stepper.js"></script>
  <script src="../../js/data/announcement-data.js"></script>
  <script src="../../js/data/activity-log.js"></script>
  <script src="../../js/components/confirm-modal.js"></script>
  <script src="../../js/data/criteria-data.js"></script>
  <script src="../../js/pages/comments.js"></script>
</body>
</html>
