<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluation | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
</head>
<body>

  <!-- Sidebar + top bar inject here, and create the #admin-page-content slot -->
  <div id="app-admin-shell" data-active-page="evaluation" data-scope-label="Welcome back, Admin"></div>

  <!-- This page's content, moved into the slot above by evaluation.js -->
  <template id="page-content-template">

  <!-- ============================================
       SELECT VIEW
  ============================================ -->
  <div id="evaluation-select-view">

    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Classroom Observation</h1>
      <p class="text-sm text-gray-500 mt-1">Select a faculty member to begin their classroom observation evaluation.</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b border-gray-300 text-gray-700">
              <th class="py-2 pr-4 font-semibold">Faculty Name</th>
              <th class="py-2 pr-4 font-semibold">Subjects</th>
              <th class="py-2 pr-4 font-semibold">Observation Status</th>
              <th class="py-2 font-semibold"></th>
            </tr>
          </thead>
          <tbody id="evaluation-faculty-table-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ============================================
       OBSERVATION FORM VIEW
  ============================================ -->
  <div id="evaluation-form-view">

    <button type="button" id="evaluation-back-to-select-btn" class="btn-secondary text-sm mb-4">
      ← Back to Faculty List
    </button>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">

      <h2 class="text-lg font-semibold text-brand mb-1">Classroom Observation Tool</h2>
      <p class="text-sm text-gray-600 mb-2" id="scale-description-text"></p>
      <p class="text-sm text-gray-700 mb-6">
        <span class="font-medium text-brand">Observing:</span>
        <span id="evaluation-faculty-name">--</span>
      </p>

      <div id="evaluation-domains-container"></div>

      <div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-200">
        <button type="button" id="evaluation-domain-back-btn" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">
          Back
        </button>
        <button type="button" id="evaluation-domain-next-btn" class="btn-primary">
          Next
        </button>
      </div>

    </div>

  </div>

  <!-- Observation Results modal (hidden by default) -->
  <div id="observation-results-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div id="observation-results-modal-backdrop" class="absolute inset-0 bg-black/40"></div>

    <div class="relative bg-white rounded-xl shadow-lg w-full max-w-md mx-4 p-6 max-h-[85vh] overflow-y-auto">
      <div id="observation-results-modal-body"></div>
      <button type="button" id="close-observation-results-modal-btn" class="btn-secondary w-full mt-4">Close</button>
    </div>
  </div>

</template>
  <script src="../../js/data/notifications-data.js"></script>
  <script src="../../js/utils/session.js"></script>
  <script src="../../js/data/profile-data.js"></script>
  <script src="../../js/data/activity-log.js"></script>
  <script src="../../js/utils/api.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/confirm-modal.js"></script>
  <script src="../../js/data/faculty-roster.js"></script>
  <script src="../../js/data/criteria-data.js"></script>
  <script src="../../js/pages/evaluation.js"></script>
</body>
</html>
