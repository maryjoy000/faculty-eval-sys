<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <style>
    @media print {
      @page {
        size: 21.59cm 33.02cm;
        margin: 1cm;
      }
      #report-tab-content table td,
      #report-tab-content table th {
        padding-top: 1px !important;
        padding-bottom: 1px !important;
        padding-left: 2px !important;
        padding-right: 2px !important;
        line-height: 1.1 !important;
      }
      #report-tab-content table {
        margin-bottom: 3px !important;
        border-spacing: 0 !important;
      }
    }
    
  </style>
</head>
<body>

  <div id="app-admin-shell" data-active-page="reports" data-scope-label="Welcome back, Admin"></div>

  <template id="page-content-template">

    <!-- ============================================
         LIST VIEW
    ============================================ -->
    <div id="reports-list-view">

      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Reports</h1>
        <p class="text-sm text-gray-500 mt-1">View and print evaluation reports for each faculty member.</p>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b border-gray-300 text-gray-700">
                <th class="py-2 pr-4 font-semibold">Faculty Name</th>
                <th class="py-2 pr-4 font-semibold">Classroom Obs.</th>
                <th class="py-2 pr-4 font-semibold">Student</th>
                <th class="py-2 pr-4 font-semibold">Peer-to-Peer</th>
                <th class="py-2 pr-4 font-semibold">HR</th>
                <th class="py-2 font-semibold"></th>
              </tr>
            </thead>
            <tbody id="admin-reports-table-body"></tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- ============================================
         DETAIL VIEW
    ============================================ -->
    <div id="reports-detail-view" class="hidden">

      <div class="no-print flex items-center justify-between bg-gray-100 border border-gray-200 rounded-t-xl px-4 py-3">
        <button type="button" id="back-to-reports-btn" class="btn-secondary text-sm">Back</button>
        <button type="button" id="print-report-btn" class="btn-primary text-sm">Print Report</button>
      </div>

      <div class="bg-white border-x border-b border-gray-200 rounded-b-xl p-6">

        <div class="mb-4 no-print">
          <h2 id="report-faculty-name" class="text-xl font-bold text-gray-800"></h2>
        </div>

        <div class="no-print flex flex-wrap gap-2 mb-4">
          <button type="button" class="report-tab-btn text-sm font-medium px-4 py-2 rounded-lg" data-tab="combined">Combined Summary</button>
          <button type="button" class="report-tab-btn text-sm font-medium px-4 py-2 rounded-lg" data-tab="classroom">Classroom Observation</button>
          <button type="button" class="report-tab-btn text-sm font-medium px-4 py-2 rounded-lg" data-tab="student">Student Evaluation</button>
          <button type="button" class="report-tab-btn text-sm font-medium px-4 py-2 rounded-lg" data-tab="peer">Peer-to-Peer</button>
          <button type="button" class="report-tab-btn text-sm font-medium px-4 py-2 rounded-lg" data-tab="hr">HR Evaluation</button>
        </div>

        <div id="report-tab-content"></div>

      </div>

    </div>

  </template>

  <script src="../../js/utils/session.js"></script>
  <script src="../../js/data/profile-data.js"></script>
  <script src="../../js/data/activity-log.js"></script>
  <script src="../../js/data/notifications-data.js"></script>
  <script src="../../js/data/faculty-roster.js"></script>
  <script src="../../js/data/criteria-data.js"></script>
  <script src="../../js/data/system-settings.js"></script>
  <script src="../../js/data/report-helpers.js"></script>
  <script src="../../js/data/weighting-data.js"></script>
  <script src="../../js/utils/api.js"></script>
  <script src="../../js/components/confirm-modal.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/pages/reports.js"></script>
</body>
</html>
