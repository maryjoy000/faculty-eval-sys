<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Management | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
</head>
<body>

  <!-- Sidebar + top bar inject here, and create the #admin-page-content slot -->
  <div id="app-admin-shell" data-active-page="faculty" data-scope-label="Welcome back, Admin"></div>

  <!-- This page's content, moved into the slot above by faculty-management.js -->
  <template id="page-content-template">

    <!-- Page header -->
    <div class="flex items-center justify-between mb-6">
        <div>
        <h1 class="text-2xl font-bold text-gray-800">Faculty Management</h1>
        <p class="text-sm text-gray-500 mt-1">Manage and monitor faculty evaluation statuses.</p>
        </div>
        <div class="flex gap-3">
        <button type="button" id="export-btn" class="btn-secondary flex items-center gap-2 text-sm">
            Export
        </button>
        <button type="button" id="add-faculty-btn" class="btn-primary flex items-center gap-2 text-sm">
            + Add Faculty
        </button>
        </div>
    </div>

    <!-- Main card -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">

        <!-- Search + filter controls -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <input
            type="text" id="search-input" placeholder="Search name or subject..."
            class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
        >
        <select
            id="status-filter"
            class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
        >
            <option value="active">Active Only</option>
            <option value="all">All (Including Archived)</option>
            <option value="archived">Archived Only</option>
        </select>
    </div>

    <!-- Faculty table -->
    <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
        <thead>
        <tr class="border-b border-gray-300 text-gray-700">
            <th class="py-2 pr-4 font-semibold">Faculty Name</th>
            <th class="py-2 pr-4 font-semibold">Current Subject</th>
            <th class="py-2 pr-4 font-semibold">Section</th>
            <th class="py-2 pr-4 font-semibold">Advisory</th>
            <th class="py-2 pr-4 font-semibold">Status</th>
            <th class="py-2 font-semibold">Actions</th>
        </tr>
        </thead>
        <tbody id="faculty-management-table-body">
        <!-- Rows rendered by JavaScript -->
        </tbody>
    </table>
    </div>

    </div>

    <!-- Single shared dropdown menu — positioned dynamically via JS, avoids being clipped by the table's scroll container -->
    <div
    id="shared-actions-dropdown"
    class="hidden fixed w-44 bg-white border border-gray-200 rounded-lg shadow-lg z-50 py-1 text-sm"
    >
    <p class="px-4 py-1.5 text-xs font-semibold text-gray-400">Actions</p>
    <a href="#" data-action="view-report" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">View Full Report</a>
    <a href="#" data-action="edit-details" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Edit Details</a>
    <a href="#" data-action="archive" class="block px-4 py-2 text-amber-600 hover:bg-gray-50">Archive</a>
    </div>

    <!-- Add Faculty modal placeholder — built in Step 9d -->
    <!-- Add Faculty modal (hidden by default) -->
    <div id="add-faculty-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">

    <!-- Backdrop -->
        <div id="modal-backdrop" class="absolute inset-0 bg-black/40"></div>

        <!-- Modal box -->
        <div class="relative bg-white rounded-xl shadow-lg w-full max-w-md mx-4 p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Add Faculty</h2>

            <form id="add-faculty-form" class="space-y-4">
                <div>
                    <label for="new-faculty-first-name" class="block text-sm font-medium text-gray-700 mb-1">
                        First Name
                    </label>
                    <input
                        type="text"
                        id="new-faculty-first-name"
                        required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                    >
                </div>

                <div>
                    <label for="new-faculty-mi" class="block text-sm font-medium text-gray-700 mb-1">
                        Middle Initial
                    </label>
                    <input
                        type="text"
                        id="new-faculty-mi"
                        maxlength="3"
                        placeholder="Optional"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                    >
                </div>

                <div>
                    <label for="new-faculty-last-name" class="block text-sm font-medium text-gray-700 mb-1">
                        Last Name
                    </label>
                    <input
                        type="text"
                        id="new-faculty-last-name"
                        required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                    >
                </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subjects</label>
                <div id="subject-inputs-container" class="space-y-2">
                    <div class="flex gap-2">
                    <input
                        type="text" class="subject-input flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                        placeholder="e.g. Programming"
                    >
                    </div>
                </div>
                <button type="button" id="add-subject-field-btn" class="text-sm text-brand font-medium mt-2 hover:underline">
                    + Add another subject
                </button>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="cancel-add-faculty" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Add Faculty</button>
            </div>
            </form>
        </div>
    </div>

    <!-- Edit Details modal -->
    <div id="edit-details-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div id="edit-details-modal-backdrop" class="absolute inset-0 bg-black/40"></div>
        <div class="relative bg-white rounded-xl shadow-lg w-full max-w-md mx-4 p-6 max-h-[85vh] overflow-y-auto">
            <h2 class="text-lg font-semibold text-gray-800 mb-1">Edit Details</h2>
            <p id="edit-details-faculty-name" class="text-sm text-gray-500 mb-4"></p>

            <div class="mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Subjects</label>
            <div id="edit-subjects-list-container" class="space-y-2 mb-2"></div>
            <div class="flex gap-2">
                <input
                type="text" id="new-subject-input" placeholder="e.g. Programming"
                class="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                >
                <button type="button" id="add-subject-btn" class="btn-secondary text-sm px-3">Add</button>
            </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Sections
                </label>

                <div id="section-list" class="space-y-2 mb-3"></div>

                <div class="grid grid-cols-2 gap-2">
                    <select
                    id="section-grade-level"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                    >
                    <option value="">Grade Level</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                    </select>

                    <input
                        type="text"
                        id="section-type"
                        placeholder="e.g. HUMSS"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                    >
                </div>

                <div class="flex gap-2 mt-2">
                    <input
                        type="text"
                        id="section-name"
                        placeholder="e.g. A"
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                    >
                    <button
                    type="button"
                    id="add-section-btn"
                    class="px-4 py-2 bg-brand text-white rounded-lg text-sm font-medium hover:opacity-90"
                    >
                    Add
                    </button>
                </div>

                <p class="text-xs text-gray-400 mt-1.5">
                    Section names are saved as a combined value such as "HUMSS A".
                </p>
                </div>

            <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Advisory Classes
            </label>

            <div
                id="advisory-class-list"
                class="space-y-2 mb-3"
            ></div>

            <div class="flex gap-2">
                <select
                id="advisory-class-select"
                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                >
                <option value="">Select advisory class</option>
                </select>

                <button
                type="button"
                id="add-advisory-class-btn"
                class="px-4 py-2 bg-brand text-white rounded-lg text-sm font-medium hover:opacity-90"
                >
                Add
                </button>
            </div>

            <p class="text-xs text-gray-400 mt-1.5">
                A faculty member may be assigned to multiple advisory classes.
            </p>
</div>

            <button type="button" id="close-edit-details-btn" class="btn-primary w-full">Done</button>
        </div>
    </div>
  </template>

  <script src="../../js/data/activity-log.js"></script>
  <script src="../../js/utils/session.js"></script>
  <script src="../../js/data/profile-data.js"></script>
  <script src="../../js/data/notifications-data.js"></script>
  <script src="../../js/utils/api.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/confirm-modal.js"></script>
  <script src="../../js/data/faculty-roster.js"></script>
  <script src="../../js/pages/faculty-management.js"></script>
</body>
</html>
