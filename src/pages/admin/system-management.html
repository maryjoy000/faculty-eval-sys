<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Management | Faculty Evaluation System</title>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
</head>
<body>

  <div id="app-admin-shell" data-active-page="system" data-scope-label="Welcome back, Admin"></div>

  <template id="page-content-template">

    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800">System Management</h1>
      <p class="text-sm text-gray-500 mt-1">Configure system-wide settings for the Faculty Evaluation System.</p>
    </div>

    <div class="flex flex-col lg:flex-row gap-4">

      <!-- Settings sub-navigation -->
      <nav class="lg:w-64 flex-shrink-0 bg-white rounded-xl border border-gray-200 shadow-sm p-3 flex lg:flex-col gap-1 overflow-x-auto">
        <button type="button" class="settings-tab-btn text-left px-4 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="academic-year">Academic Year</button>
        <button type="button" class="settings-tab-btn text-left px-4 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="weighting">Score Weighting</button>
        <button type="button" class="settings-tab-btn text-left px-4 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="evaluation-period">Evaluation Period</button>
        <button type="button" class="settings-tab-btn text-left px-4 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="announcement">Announcement</button>
        <button type="button" class="settings-tab-btn text-left px-4 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="accounts">User Accounts</button>
      </nav>

      <!-- Settings panels (one shown at a time) -->
      <div class="flex-1">

        <div id="settings-panel-academic-year" class="settings-panel bg-white rounded-xl border border-gray-200 shadow-sm p-6">
          <h2 class="font-semibold text-gray-800 mb-1">Academic Year &amp; Semester</h2>
          <p class="text-sm text-gray-500 mb-4">This appears across the login page, evaluation forms, dashboard, and printed reports.</p>

          <form id="academic-year-form" class="space-y-4 max-w-sm">
            <div>
              <label for="academic-year-input" class="block text-sm font-medium text-gray-700 mb-1">Academic Year</label>
              <input type="text" id="academic-year-input" placeholder="e.g. 2025-2026"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
            </div>
            <div>
              <label for="semester-input" class="block text-sm font-medium text-gray-700 mb-1">Semester</label>
              <select id="semester-input" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                <option value="1st">1st Semester</option>
                <option value="2nd">2nd Semester</option>
                <option value="3rd">3rd Semester</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
            <p id="academic-year-saved-msg" class="hidden text-sm text-green-600">Saved! This will now appear across the system.</p>
          </form>
        </div>

        <div id="settings-panel-weighting" class="settings-panel hidden bg-white rounded-xl border border-gray-200 shadow-sm p-6">
          <h2 class="font-semibold text-gray-800 mb-1">Score Weighting</h2>
          <p class="text-sm text-gray-500 mb-4">
            Based on the PPST/RPMS structure. Set weights at each level — the effective contribution of each evaluation type is calculated automatically.
          </p>

          <form id="weighting-form" class="space-y-6 max-w-md">

            <!-- Level 1: Classroom vs Non-Classroom -->
            <div class="border border-gray-200 rounded-lg p-4">
              <h3 class="text-sm font-semibold text-gray-700 mb-3">Overall Split</h3>
              <div class="flex items-center gap-3">
                <label for="weight-classroom-input" class="text-sm text-gray-600 flex-1">Classroom Observation (Admin)</label>
                <div class="relative w-24">
                  <input type="number" id="weight-classroom-input" min="0" max="100" step="0.01"
                    class="w-full border border-gray-300 rounded-lg px-3 py-1.5 pr-6 text-sm text-right focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                  <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">%</span>
                </div>
              </div>
              <p class="text-xs text-gray-400 mt-2">Non-Classroom Observable: <span id="non-classroom-display">30</span>%</p>
            </div>

            <!-- Level 2: Domain 6 vs Domain 7 (within Non-Classroom) -->
            <div class="border border-gray-200 rounded-lg p-4">
              <h3 class="text-sm font-semibold text-gray-700 mb-3">Within Non-Classroom Observable</h3>

              <div class="flex items-center gap-3 mb-2">
                <label for="weight-domain6-input" class="text-sm text-gray-600 flex-1">Domain 6: Community Linkages &amp; Professional Engagement</label>
                <div class="relative w-24">
                  <input type="number" id="weight-domain6-input" min="0" max="100" step="0.01"
                    class="w-full border border-gray-300 rounded-lg px-3 py-1.5 pr-6 text-sm text-right focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                  <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">%</span>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <label for="weight-domain7-input" class="text-sm text-gray-600 flex-1">Domain 7: Personal Growth &amp; Professional Development</label>
                <div class="relative w-24">
                  <input type="number" id="weight-domain7-input" min="0" max="100" step="0.01"
                    class="w-full border border-gray-300 rounded-lg px-3 py-1.5 pr-6 text-sm text-right focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                  <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">%</span>
                </div>
              </div>
              <p id="domain-total-msg" class="text-xs mt-2"></p>
            </div>

            <!-- Level 3: Peer vs Student (within Domain 6) -->
            <div class="border border-gray-200 rounded-lg p-4">
              <h3 class="text-sm font-semibold text-gray-700 mb-3">Within Domain 6</h3>

              <div class="flex items-center gap-3 mb-2">
                <label for="weight-peer-input" class="text-sm text-gray-600 flex-1">Peer-to-Peer Evaluation</label>
                <div class="relative w-24">
                  <input type="number" id="weight-peer-input" min="0" max="100" step="0.01"
                    class="w-full border border-gray-300 rounded-lg px-3 py-1.5 pr-6 text-sm text-right focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                  <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">%</span>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <label for="weight-student-input" class="text-sm text-gray-600 flex-1">Student Evaluation</label>
                <div class="relative w-24">
                  <input type="number" id="weight-student-input" min="0" max="100" step="0.01"
                    class="w-full border border-gray-300 rounded-lg px-3 py-1.5 pr-6 text-sm text-right focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                  <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">%</span>
                </div>
              </div>
              <p id="domain6-split-total-msg" class="text-xs mt-2"></p>
            </div>

            <div class="text-xs text-gray-400 italic">Domain 7 (HR Evaluation) uses 100% of its allocation — no further split, since HR evaluation is currently a single component.</div>

            <!-- Effective weights summary -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
              <h3 class="text-sm font-semibold text-gray-700 mb-2">Effective Weight of Total</h3>
              <div id="effective-weights-display" class="space-y-1 text-sm text-gray-600"></div>
            </div>

            <button type="submit" class="btn-primary">Save Weighting</button>
            <p id="weighting-saved-msg" class="hidden text-sm text-green-600">Saved!</p>
          </form>
        </div>

        <div id="settings-panel-evaluation-period"
            class="settings-panel hidden bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <h2 class="font-semibold text-gray-800 mb-1">Evaluation Period</h2>
            <p class="text-sm text-gray-500 mb-4">Controls when students are able to submit faculty evaluations. Leave both
                fields blank for no restriction.</p>
        
            <form id="evaluation-period-form" class="space-y-4 max-w-sm">

              <div>
                  <label for="evaluation-type-input"
                      class="block text-sm font-medium text-gray-700 mb-1">
                      Evaluation Type
                  </label>

                  <select
                      id="evaluation-type-input"
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                  >
                      <option value="student">Student Evaluation</option>
                      <option value="classroomObservation">Classroom Observation</option>
                      <option value="peerToPeer">Peer-to-Peer Evaluation</option>
                      <option value="hrEvaluation">HR Evaluation</option>
                  </select>
              </div>

              <div>
                  <label for="period-start-date"
                      class="block text-sm font-medium text-gray-700 mb-1">
                      Opens On
                  </label>

                  <input
                      type="date"
                      id="period-start-date"
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                  >
              </div>

              <div>
                  <label for="period-end-date"
                      class="block text-sm font-medium text-gray-700 mb-1">
                      Closes On
                  </label>

                  <input
                      type="date"
                      id="period-end-date"
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                  >
              </div>

              <button type="submit" class="btn-primary">
                  Save Changes
              </button>

              <p id="evaluation-period-saved-msg"
                  class="hidden text-sm text-green-600">
                  Saved!
              </p>

          </form>
        </div>

        <div id="settings-panel-announcement"
            class="settings-panel hidden bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <h2 class="font-semibold text-gray-800 mb-1">Announcement</h2>
            <p class="text-sm text-gray-500 mb-4">A short notice shown to students across the evaluation pages.</p>
        
            <form id="announcement-form" class="space-y-4 max-w-md">
                <div>
                    <label for="announcement-message-input" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea id="announcement-message-input" rows="3" placeholder="e.g. Evaluations close on March 15."
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"></textarea>
                </div>
        
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="announcement-active-checkbox"
                        class="rounded border-gray-300 text-brand focus:ring-brand">
                    Show this announcement to students
                </label>
        
                <button type="submit" class="btn-primary">Save Changes</button>
                <p id="announcement-saved-msg" class="hidden text-sm text-green-600">Saved!</p>
            </form>
        </div>

        <div id="settings-panel-accounts"
          class="settings-panel hidden bg-white rounded-xl border border-gray-200 shadow-sm p-6">
          <div class="flex items-center justify-between mb-1">
            <h2 class="font-semibold text-gray-800">User Accounts</h2>
            <button type="button" id="add-account-btn" class="btn-primary text-sm">+ Add Account</button>
          </div>
          <p class="text-sm text-gray-500 mb-4">Manage Admin, HR, and Faculty accounts.
            view only.</p>
        
          <div class="flex flex-col sm:flex-row gap-3 mb-4">
            <input type="text" id="account-search-input" placeholder="Search name or username..."
              class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
            <select id="account-role-filter"
              class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
              <option value="all">All Roles</option>
              <option value="admin">Admin</option>
              <option value="hr">HR</option>
              <option value="faculty">Faculty</option>
            </select>
          </div>
        
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b border-gray-300 text-gray-700">
                  <th class="py-2 pr-4 font-semibold">Name</th>
                  <th class="py-2 pr-4 font-semibold">Username</th>
                  <th class="py-2 pr-4 font-semibold">Role</th>
                  <th class="py-2 pr-4 font-semibold">Status</th>
                  <th class="py-2 font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody id="accounts-table-body"></tbody>
            </table>
          </div>
        </div>
        
        <!-- Add/Edit Account modal -->
        <div id="account-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
          <div id="account-modal-backdrop" class="absolute inset-0 bg-black/40"></div>
        
          <div class="relative bg-white rounded-xl shadow-lg w-full max-w-sm mx-4 p-6">
            <h2 id="account-modal-title" class="text-lg font-semibold text-gray-800 mb-4">Add Account</h2>
        
            <form id="account-form" class="space-y-4">
              <input type="hidden" id="account-form-id">
        
              <div>
                <label for="account-name-input" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="account-name-input" required
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
              </div>
        
              <div>
                <label for="account-username-input" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="account-username-input" required
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                <p class="text-xs text-gray-400 mt-1">Must start with "admin-", "hr-", or match the role convention.</p>
              </div>

              <div>
                <label
                  for="account-password-input"
                  class="block text-sm font-medium text-gray-700 mb-1"
                >
                  Password
                </label>

                <input
                  type="password"
                  id="account-password-input"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
                  autocomplete="new-password"
                >

                <p class="text-xs text-gray-400 mt-1">
                  Required when creating an account. Leave blank when editing to keep the current password.
                </p>
              </div>
        
              <div>
                <label for="account-role-input" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                <select id="account-role-input"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent">
                  <option value="admin">Admin</option>
                  <option value="hr">HR</option>
                  <option value="faculty">Faculty</option>
                </select>
              </div>
        
              <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="cancel-account-btn" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Save Account</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>

  </template>

  <script src="../../js/data/system-settings.js"></script>
  <script src="../../js/utils/session.js"></script>
  <script src="../../js/data/profile-data.js"></script>
  <script src="../../js/data/activity-log.js"></script>
  <script src="../../js/data/notifications-data.js"></script>
  <script src="../../js/utils/api.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/data/strands-data.js"></script>
  <script src="../../js/data/evaluation-period.js"></script>
  <script src="../../js/data/announcement-data.js"></script>
  <script src="../../js/data/accounts-data.js"></script>
  <script src="../../js/components/confirm-modal.js"></script>
  <script src="../../js/data/faculty-roster.js"></script>
  <script src="../../js/data/weighting-data.js"></script>
  <script src="../../js/pages/system-management.js"></script>
</body>
</html>
